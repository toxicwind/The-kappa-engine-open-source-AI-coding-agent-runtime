<style>
  /* Hide Color Scheme toolbar when kappa-vscode theme is active */
  html[data-kappa-theme="kappa-vscode"] [aria-label^="Color Scheme"] {
    display: none !important;
  }

  /* Hide VS Code Theme toolbar by default and when kappa theme is active */
  html:not([data-kappa-theme="kappa-vscode"]) [aria-label^="VSCode Theme"] {
    display: none !important;
  }
</style>
