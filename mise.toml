# kappa monorepo build tasks (mbx-cache / nativelink enabled).
# `mise run kappa-build` produces the single CLI binary; mbx-cache restores it
# from the remote task cache at 127.0.0.1:25148 when the inputs are unchanged.

[task_config.cache]
enabled = true

[tasks.kappa-build]
description = "Build the main kappa single binary -> dist/@kappacode/*/bin/kappa"
run = "bun run --cwd packages/opencode script/build.ts --single --skip-install"
sources = [
  "package.json",
  "bun.lock",
  "packages/opencode/src/**/*.{ts,tsx}",
  "packages/opencode/script/**/*.ts",
  "packages/llm/src/**/*.ts",
  "packages/kappa-console/src/**/*.{ts,tsx}",
]
outputs = ["packages/opencode/dist/**/bin/kappa"]

[tasks.kappa-install]
description = "Install kappacode workspace dependencies once, richly cached"
run = "bun install --no-progress && touch node_modules/.install-complete"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/.install-complete"]


[tasks.kappa-dev]
description = "Run the kappa CLI locally via opencode"
run = "bun run --cwd packages/cli --conditions=node src/index.ts"
